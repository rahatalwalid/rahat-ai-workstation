name: Unpack release zip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the release into the repo root
        run: |
          ZIP=$(ls rahat-desecret-*.zip | head -n 1)
          unzip -o "$ZIP"
          rm -f "$ZIP"
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack Rahat DeSecret v0.4 (1)" || echo "Nothing to commit"
          git push
workflow_dispatch:
